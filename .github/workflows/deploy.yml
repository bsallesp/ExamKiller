name: Deploy to Hetzner vm2 (azure.controlcrest.com)

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  VM2_HOST: 159.69.251.137
  APP_DIR: /opt/azure-cc

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package source
        run: tar -czf /tmp/examkiller.tgz --exclude=node_modules --exclude=.next --exclude=data --exclude=tests --exclude=.git --exclude=.github --exclude=*.tsbuildinfo .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ env.VM2_HOST }} >> ~/.ssh/known_hosts

      - name: Package source
        run: tar -czf /tmp/examkiller.tgz --exclude=node_modules --exclude=.next --exclude=data --exclude=tests --exclude=.git --exclude=.github --exclude=*.tsbuildinfo .

      - name: Upload and deploy
        run: |
          scp -i ~/.ssh/id_deploy /tmp/examkiller.tgz root@${{ env.VM2_HOST }}:/tmp/examkiller.tgz
          ssh -i ~/.ssh/id_deploy root@${{ env.VM2_HOST }} "
            set -e
            cd ${{ env.APP_DIR }}
            tar -xzf /tmp/examkiller.tgz
            npm ci
            npm run build
            systemctl restart examkiller-azure
            sleep 5
          "

      - name: Health check
        run: |
          code=\$(curl -s -o /dev/null -w '%{http_code}' https://azure.controlcrest.com/ --max-time 30)
          echo "azure.controlcrest.com -> HTTP \$code"
          test \"\$code\" = \"200\"
